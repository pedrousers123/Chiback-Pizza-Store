<section class="cardapio">

  <div class="titulo-cardapio">
    <span>🍕 FEITAS COM CARINHO</span>
    <h2>Nosso Cardápio</h2>
    <p>Escolha sua pizza favorita da Chiback!</p>
  </div>

  <div class="pizza-grid">

    @for (pizza of produtos(); track pizza.id) {
      <app-pizza-card [pizza]="pizza"></app-pizza-card>
    }

  </div>

</section>
