<header class="header">

  <div class="logo">
    <img src="img/logo.png" alt="Logo da Chiback">

    <div>
      <h1>Chiback</h1>
      <span>Pizzaria</span>
    </div>
  </div>

  <nav>
    <a href="#">Início</a>
    <a href="#cardapio">Cardápio</a>

    <button
      type="button"
      class="cart-button"
      (click)="abrir()"
    >
      🛒

      @if (quantidade() > 0) {
        <span class="cart-badge">
          {{ quantidade() }}
        </span>
      }
    </button>
  </nav>

</header>
