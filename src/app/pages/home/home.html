<app-header
  (abrirCarrinho)="abrirCarrinho()"
></app-header>

<main>

  <section class="hero">

    <div class="hero-content">

      <span class="destaque">
        🍕 PIZZARIA CHIBACK
      </span>

      <h1>
        A pizza que<br>
        <strong>você merece!</strong>
      </h1>

      <p>
        Ingredientes selecionados, massa deliciosa
        e muito sabor em cada pedaço.
      </p>

      <a href="#cardapio" class="btn-cardapio">
        Ver nosso cardápio
      </a>

    </div>

    <div class="hero-image">
      <img
        src="img/queijos.jpg"
        alt="Pizza da Pizzaria Chiback"
      >
    </div>

  </section>

  <section id="cardapio">
    <app-pizza-list></app-pizza-list>
  </section>

  @if (carrinhoAberto()) {
    <app-cart
      (fecharCarrinho)="fecharCarrinho()"
    ></app-cart>
  }

</main>
