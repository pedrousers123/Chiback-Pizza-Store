<main class="checkout-page">

  <div class="checkout-card">

    <h1>🍕 Finalizar compra</h1>

    <p>Preencha seus dados para finalizar o pedido.</p>

    <h2>📋 Dados do cliente</h2>

    <form
      #formulario="ngForm"
      (ngSubmit)="finalizar(formulario)"
    >

      <label for="nome">Nome completo</label>

      <input
        id="nome"
        name="nome"
        type="text"
        [(ngModel)]="nome"
        required
        placeholder="Digite seu nome"
      >

      <label for="cpf">CPF</label>

      <input
        id="cpf"
        name="cpf"
        type="text"
        [(ngModel)]="cpf"
        required
        placeholder="000.000.000-00"
      >

      <label for="email">E-mail</label>

<input
  id="email"
  name="email"
  type="email"
  [(ngModel)]="email"
  #emailCampo="ngModel"
  required
  email
  placeholder="seuemail@email.com"
>

@if (emailCampo.invalid && emailCampo.touched) {
  <small class="erro-email">
    ⚠️ Digite um e-mail válido.
  </small>
}

      <label for="endereco">Endereço</label>

      <input
        id="endereco"
        name="endereco"
        type="text"
        [(ngModel)]="endereco"
        required
        placeholder="Rua, número e bairro"
      >

      <label for="pagamento">
        Método de pagamento
      </label>

      <select
        id="pagamento"
        name="pagamento"
        [(ngModel)]="pagamento"
        required
      >

        <option value="">
          Selecione
        </option>

        <option value="Pix">
          Pix
        </option>

        <option value="Cartão de crédito">
          Cartão de crédito
        </option>

        <option value="Cartão de débito">
          Cartão de débito
        </option>

        <option value="Dinheiro">
          Dinheiro
        </option>

      </select>

      <div class="buttons">

        <button
          type="button"
          (click)="voltar()"
        >
          ← Voltar
        </button>

        <button
          type="submit"
        >
          🍕 Finalizar compra
        </button>

      </div>

    </form>

  </div>

</main>
