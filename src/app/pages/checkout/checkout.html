<main class="checkout-page">

  <div class="checkout-container">

    <div class="checkout-header">
      <h1>🍕 Finalizar Pedido</h1>

      <p>
        Preencha seus dados para finalizar sua compra.
      </p>
    </div>


    <section class="checkout-card">

      <h2>📋 Dados do cliente</h2>


      <!-- NOME -->
      <div class="campo">

        <label for="nome">
          Nome completo
        </label>

        <input
          id="nome"
          type="text"
          name="nome"
          [(ngModel)]="nome"
          placeholder="Digite seu nome"
        >

      </div>


      <!-- EMAIL -->
      <div class="campo">

        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail"
        >

      </div>


      <!-- CPF -->
      <div class="campo">

        <label for="cpf">
          CPF
        </label>

        <input
          id="cpf"
          type="text"
          name="cpf"
          [(ngModel)]="cpf"
          placeholder="000.000.000-00"
          maxlength="14"
        >

        <small>
          Seu CPF será validado antes de finalizar o pedido.
        </small>

      </div>


      <!-- ENDEREÇO -->
      <div class="campo">

        <label for="endereco">
          Endereço
        </label>

        <input
          id="endereco"
          type="text"
          name="endereco"
          [(ngModel)]="endereco"
          placeholder="Rua, número, bairro..."
        >

      </div>


      <!-- PAGAMENTO -->
      <div class="campo">

        <label for="pagamento">
          Forma de pagamento
        </label>

        <select
          id="pagamento"
          name="pagamento"
          [(ngModel)]="pagamento"
        >

          <option value="">
            Selecione uma opção
          </option>

          <option value="Pix">
            Pix
          </option>

          <option value="Cartão de crédito">
            Cartão de crédito
          </option>

          <option value="Cartão de débito">
            Cartão de débito
          </option>

          <option value="Dinheiro">
            Dinheiro
          </option>

        </select>

      </div>


      <!-- FINALIZAR -->
      <button
        type="button"
        class="finalizar-button"
        (click)="finalizarPedido()"
      >
        🍕 Finalizar pedido
      </button>


      <!-- VOLTAR -->
      <button
        type="button"
        class="voltar-button"
        onclick="history.back()"
      >
        ← Voltar
      </button>

    </section>

  </div>

</main>
